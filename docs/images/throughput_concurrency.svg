<svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <rect x="0" y="0" width="520" height="340" rx="10" fill="#fcfcfb"/>
  <text x="24" y="30" font-size="15" font-weight="600" fill="#0b0b0b">Write throughput holds flat under concurrency</text>
  <text x="24" y="48" font-size="11" fill="#898781">points/sec, 1 to 32 concurrent writer threads against one shared engine</text>

  <!-- gridlines -->
  <line x1="50" y1="270" x2="490" y2="270" stroke="#c3c2b7" stroke-width="1"/>
  <g stroke="#e1e0d9" stroke-width="1">
    <line x1="50" y1="174.5" x2="490" y2="174.5"/>
    <line x1="50" y1="79.1" x2="490" y2="79.1"/>
  </g>
  <g font-size="10" fill="#898781" text-anchor="end">
    <text x="44" y="273">0</text>
    <text x="44" y="178">25,000</text>
    <text x="44" y="83">50,000</text>
  </g>

  <!-- line -->
  <polyline points="50,92.5 138,94.3 226,87.1 314,85.6 402,86.9 490,83.3"
            fill="none" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

  <g>
    <circle cx="50" cy="92.5" r="4" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
    <text x="50" y="74" font-size="11" font-weight="600" fill="#0b0b0b" text-anchor="middle">46,500</text>

    <circle cx="138" cy="94.3" r="4" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
    <circle cx="226" cy="87.1" r="4" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
    <circle cx="314" cy="85.6" r="4" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
    <circle cx="402" cy="86.9" r="4" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>

    <circle cx="490" cy="83.3" r="4" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
    <text x="490" y="66" font-size="11" font-weight="600" fill="#0b0b0b" text-anchor="middle">48,920</text>
  </g>

  <!-- x axis labels -->
  <g font-size="11" fill="#52514e" text-anchor="middle">
    <text x="50" y="295">1</text>
    <text x="138" y="295">2</text>
    <text x="226" y="295">4</text>
    <text x="314" y="295">8</text>
    <text x="402" y="295">16</text>
    <text x="490" y="295">32</text>
  </g>
  <text x="270" y="318" font-size="10" fill="#898781" text-anchor="middle">concurrent writer threads</text>
</svg>
