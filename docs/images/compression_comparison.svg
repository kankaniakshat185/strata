<svg viewBox="0 0 520 350" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <rect x="0" y="0" width="520" height="350" rx="10" fill="#fcfcfb"/>
  <text x="24" y="30" font-size="15" font-weight="600" fill="#0b0b0b">Compression: naive storage vs. Gorilla encoding</text>
  <text x="24" y="48" font-size="11" fill="#898781">bytes per point, lower is better</text>

  <!-- gridlines -->
  <line x1="50" y1="278" x2="500" y2="278" stroke="#c3c2b7" stroke-width="1"/>
  <g stroke="#e1e0d9" stroke-width="1">
    <line x1="50" y1="224.7" x2="500" y2="224.7"/>
    <line x1="50" y1="171.3" x2="500" y2="171.3"/>
    <line x1="50" y1="118" x2="500" y2="118"/>
    <line x1="50" y1="64.7" x2="500" y2="64.7"/>
  </g>
  <g font-size="10" fill="#898781" text-anchor="end">
    <text x="44" y="281">0</text>
    <text x="44" y="228">4</text>
    <text x="44" y="175">8</text>
    <text x="44" y="121">12</text>
    <text x="44" y="68">16</text>
  </g>

  <!-- Regular-cadence group -->
  <rect x="102" y="64.7" width="50" height="213.3" rx="4" fill="#2a78d6"/>
  <rect x="162" y="228.1" width="50" height="49.9" rx="4" fill="#eb6834"/>
  <text x="187" y="219" font-size="11" font-weight="600" fill="#0b0b0b" text-anchor="middle">3.74</text>
  <text x="157.5" y="300" font-size="11" fill="#52514e" text-anchor="middle">Regular-cadence</text>
  <text x="157.5" y="314" font-size="11" fill="#52514e" text-anchor="middle">metrics</text>

  <!-- Smooth-drift group -->
  <rect x="317.5" y="64.7" width="50" height="213.3" rx="4" fill="#2a78d6"/>
  <rect x="377.5" y="183.2" width="50" height="94.8" rx="4" fill="#eb6834"/>
  <text x="402.5" y="174" font-size="11" font-weight="600" fill="#0b0b0b" text-anchor="middle">7.11</text>
  <text x="372.5" y="300" font-size="11" fill="#52514e" text-anchor="middle">Smooth-drift</text>
  <text x="372.5" y="314" font-size="11" fill="#52514e" text-anchor="middle">metrics</text>

  <!-- legend -->
  <rect x="240" y="332" width="12" height="2" fill="#2a78d6"/>
  <text x="256" y="336" font-size="10" fill="#52514e">Naive (16 B/pt fixed)</text>
  <rect x="390" y="332" width="12" height="2" fill="#eb6834"/>
  <text x="406" y="336" font-size="10" fill="#52514e">Gorilla</text>
</svg>
